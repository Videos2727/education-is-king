<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Education is King</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      color: #1f2937;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 25px;
      text-align: center;
    }

    nav {
      background: #dbeafe;
      padding: 12px;
      text-align: center;
    }

    nav button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 18px;
      border-radius: 12px;
      margin: 15px 0;
      background: #f8fafc;
    }

    .card button {
      background: #16a34a;
      color: white;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 650px;
      border: none;
      margin-top: 20px;
      border-radius: 10px;
    }

    .warning {
      background: #fff7ed;
      border-left: 5px solid #f97316;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Education is King</h1>
    <p>Online PowerPoint lessons by year group and topic</p>
  </header>

  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="showLessons()">Lessons</button>
  </nav>

  <main id="content">
    <h2>Welcome</h2>
    <p>This website allows students to view PowerPoint lessons online.</p>

    <div class="warning">
      Important: Because the PowerPoints are stored in GitHub, students may still be able to download them if they find the file link.
    </div>
  </main>

  <script>
    const websiteBase = "https://Videos2727.github.io/education-is-king/";

    const lessonData = {
      "Year 10": {
        "Physics": [
          {
            title: "Motion",
            topic: "Physics",
            ppt: "powerpoints/year10/physics/motion.pptx",
            question: "Explain the difference between speed and velocity."
          }
        ]
      }
    };

    function showHome() {
      document.getElementById("content").innerHTML = `
        <h2>Welcome</h2>
        <p>This website allows students to view PowerPoint lessons online.</p>
        <div class="warning">
          Important: Because the PowerPoints are stored in GitHub, students may still be able to download them if they find the file link.
        </div>
      `;
    }

    function showLessons() {
      let html = "<h2>Lessons</h2>";

      for (const year in lessonData) {
        html += `<h3>${year}</h3>`;

        for (const subject in lessonData[year]) {
          html += `<h4>${subject}</h4>`;

          lessonData[year][subject].forEach((lesson, index) => {
            html += `
              <div class="card">
                <h3>${lesson.title}</h3>
                <p><strong>Topic:</strong> ${lesson.topic}</p>
                <p><strong>Question:</strong> ${lesson.question}</p>
                <button onclick="openLesson('${year}', '${subject}', ${index})">Open Lesson</button>
              </div>
            `;
          });
        }
      }

      document.getElementById("content").innerHTML = html;
    }

    function openLesson(year, subject, index) {
      const lesson = lessonData[year][subject][index];
      const pptUrl = websiteBase + lesson.ppt;
      const viewerUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(pptUrl);

      document.getElementById("content").innerHTML = `
        <h2>${lesson.title}</h2>
        <p><strong>${year} - ${subject}</strong></p>
        <p><strong>Question:</strong> ${lesson.question}</p>
        <iframe src="${viewerUrl}"></iframe>
      `;
    }
  </script>
</body>
</html>
